# Builds the installers and, for a v* tag, attaches them to a GitHub Release.
#
#   Windows  VoxCordis-<v>-windows-x64-setup.exe  (Inno Setup, not code-signed)
#   Linux    VoxCordis-<v>-x86_64.AppImage
#            voxcordis_<v>_amd64.deb, voxcordis-<v>-1.x86_64.rpm
#
# A stable tag also updates the signed apt and dnf repository that GitHub
# Pages serves under /repo/ (the repo/ folder of the gh-pages branch, see
# docs/RELEASING.md).
#
# A v* tag is pushed here by the maintainer's release pipeline, together with
# the source commit it points at. A hand run (Actions -> Release -> Run
# workflow) builds Linux only unless asked, and keeps the files as workflow
# artifacts without making a release.
#
# Only the release job holds secrets: the Ed25519 key that signs each
# installer's checksum and the key that signs the packages, both kept in the
# "release" environment (see docs/RELEASING.md). The app updates itself from this repository's latest
# release and installs only files signed by that key.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build (a test build by hand)
        type: choice
        options: [all, linux, windows]
        default: linux

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.x
  UPDATE_REPO: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from the tag, else from pubspec.yaml
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v=${GITHUB_REF#refs/tags/v}
          else
            v=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)-dev.${GITHUB_RUN_NUMBER}
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"
      # A release must carry the release key, so the next update can be
      # checked against it (lib/services/release_signature.dart).
      - name: Release key built in
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q 'BEGIN PUBLIC KEY' lib/services/release_signature.dart || {
            echo "::error::releasePublicKey is empty; refusing to publish."; exit 1; }

  linux:
    needs: [version]
    # Tags build both; by hand, as chosen.
    if: inputs.platforms != 'windows'
    # Oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev liblzma-dev libstdc++-12-dev desktop-file-utils rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build linux --release --build-name "${VERSION%%-*}"
          --dart-define=APP_VERSION="$VERSION" --dart-define=UPDATE_REPO="$UPDATE_REPO"
      - name: AppImage
        run: packaging/linux/build-appimage.sh build/linux/x64/release/bundle "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
      - name: .deb and .rpm
        run: packaging/linux/build-packages.sh build/linux/x64/release/bundle "$VERSION" dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm

  windows:
    needs: [version]
    if: inputs.platforms != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: |
          $buildName = ($env:VERSION -split '-')[0]
          flutter build windows --release --build-name $buildName `
            --dart-define=APP_VERSION=$env:VERSION --dart-define=UPDATE_REPO=$env:UPDATE_REPO
      - name: Ship the MSVC runtime next to the app
        # Flutter apps need it and a fresh Windows may not have it installed.
        run: |
          $out = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $out
          }
      - name: Installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /DAppVersion=$env:VERSION "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" packaging\windows\voxcordis.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # Holds RELEASE_SIGNING_KEY; the environment limits it to v* tags and
    # asks the maintainer to approve each use.
    environment: release
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{appimage,windows,packages}'
          merge-multiple: true
      # The .rpm files carry a GPG signature of their own (dnf checks it);
      # the apt side signs its index instead. Done before the checksums below
      # are signed, because signing changes the file.
      - name: Sign the .rpm
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is not set; refusing to publish."; exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          [ -n "$fpr" ] || { echo "::error::No key in PACKAGE_SIGNING_KEY."; exit 1; }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "KEY_FPR=$fpr" >> "$GITHUB_ENV"
          rpmsign --define "_gpg_name $fpr" --define "_gpg_path $GNUPGHOME" --addsign dist/*.rpm
      # Ed25519 over each file's SHA-256 (hex), as <file>.sig; the updater
      # installs only files signed by the key it has built in.
      - name: Sign the installers
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set; refusing to publish."; exit 1
          fi
          key="$RUNNER_TEMP/release-key.pem"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          for f in dist/*; do
            sha256sum "$f" | cut -d' ' -f1 | tr -d '\n' > "$RUNNER_TEMP/sha"
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/sha" -out "$f.sig"
          done
          rm -f "$key"
      - run: ls -la dist
      # The release page shows this version's section of CHANGELOG.md, the
      # same notes the app shows after updating.
      - name: Release notes
        id: notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 .github/scripts/changelog.py notes "$v" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CHANGELOG.md has no '## $v' or Unreleased notes; the app will show none for it."
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned to a commit: this step publishes the release.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: ${{ steps.notes.outputs.generated == 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
      # The apt and dnf repository lives in the repo/ folder of the gh-pages
      # branch (GitHub Pages, "deploy from a branch"). Only repo/ is touched;
      # the rest of the branch is the website. The branch is one fresh commit
      # each time so old packages don't pile up in git. A pre-release stays
      # out.
      - name: Update the apt and dnf repository
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/new"
          cp dist/*.deb dist/*.rpm "$RUNNER_TEMP/new/"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          site="$RUNNER_TEMP/site"
          published=false
          for attempt in 1 2 3 4; do
            rm -rf "$site"
            if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null 2>&1; then
              git clone -q --depth 1 --branch gh-pages "$url" "$site"
              lease=$(git -C "$site" rev-parse HEAD)
            else
              git init -q -b gh-pages "$site"
              git -C "$site" remote add origin "$url"
              lease=
            fi
            # The repository is served from the site's address: its custom
            # domain when CNAME names one (github.io would redirect there
            # through plain http, which apt refuses), else github.io.
            if [ -s "$site/CNAME" ]; then
              export BASE_URL="https://$(head -n 1 "$site/CNAME" | tr -d '[:space:]')/repo"
            else
              export BASE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/repo"
            fi
            packaging/linux/build-repo.sh "$RUNNER_TEMP/new" "$site/repo"
            touch "$site/.nojekyll"
            git -C "$site" checkout -q --orphan fresh
            git -C "$site" add -A
            git -C "$site" -c user.name=Nucume \
                -c user.email=119841008+Nucume@users.noreply.github.com \
                commit -q -m "Package repository for ${GITHUB_REF_NAME#v}"
            # Someone else (the website) may have pushed meanwhile: then the
            # lease fails and everything is done again on top of theirs.
            if git -C "$site" push -q --force-with-lease="gh-pages:$lease" origin fresh:gh-pages; then
              published=true; break
            fi
            sleep $((attempt * 10))
          done
          $published || { echo "::error::Could not update gh-pages."; exit 1; }
          # A push made with the workflow token may not start the Pages
          # build by itself.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null \
            || echo "::warning::Could not start a Pages build; check Settings > Pages."
